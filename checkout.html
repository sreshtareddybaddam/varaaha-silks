<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Varaaha Silks</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;background:#f8f4ed;color:#30251f;font-family:"DM Sans"}header{padding:24px 7vw;border-bottom:1px solid #e3d8ce;display:flex;justify-content:space-between}header a{color:inherit;text-decoration:none;font-size:12px}.logo{font:600 20px "Playfair Display";letter-spacing:3px}.logo small{display:block;font:8px "DM Sans";letter-spacing:4px;text-align:center}main{max-width:1000px;margin:auto;padding:60px 7vw}h1{font:600 54px "Playfair Display"}.grid{display:grid;grid-template-columns:1fr 330px;gap:45px}.box,.summary{background:#fffaf4;padding:25px}.field{margin:15px 0}.field label{display:block;font-size:10px;letter-spacing:1.3px;text-transform:uppercase;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;padding:13px;border:1px solid #d5c8bc;background:#fffaf4}.field textarea{min-height:85px}.btn{width:100%;border:0;background:#30251f;color:#fff;padding:15px;font-size:11px;margin-top:15px}.line{display:flex;justify-content:space-between;padding:10px 0;font-size:12px}.success{display:none;text-align:center;background:#eee5dc;padding:40px}.success h2{font:35px "Playfair Display"}@media(max-width:800px){main{padding:40px 20px}.grid{grid-template-columns:1fr}}
</style></head><body><header><a class="logo" href="/">VARAAHA<small>SILKS</small></a><a href="cart.html">← Bag</a></header><main><h1>Checkout</h1><div id="formWrap" class="grid"><form class="box" id="form"><h2>Customer details</h2><div class="field"><label>Full name</label><input name="name" required></div><div class="field"><label>Phone</label><input name="phone" required></div><div class="field"><label>Email</label><input name="email" type="email"></div><div class="field"><label>Address</label><textarea name="address" required></textarea></div><div class="field"><label>Order method</label><select name="method"><option>Store pickup — Nirmal</option><option>Home delivery — confirm charges</option></select></div><button class="btn">PLACE ORDER</button></form><aside class="summary"><h2>Order</h2><div id="summary"></div><div class="line"><b>Total</b><b id="total"></b></div></aside></div><div class="success" id="success"><h2>Order received ✨</h2><p id="msg"></p><a href="/" class="btn">BACK TO STORE</a></div></main>
<script>
let cart=JSON.parse(localStorage.getItem("varaahaCart")||"[]");const money=n=>"₹"+Number(n).toLocaleString("en-IN");let total=cart.reduce((s,p)=>s+p.price*p.qty,0);
if(!cart.length)location.href="/";document.getElementById("summary").innerHTML=cart.map(p=>`<div class="line"><span>${p.name} × ${p.qty}</span><b>${money(p.price*p.qty)}</b></div>`).join("");document.getElementById("total").textContent=money(total);
document.getElementById("form").onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);let r=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:f.get("name"),phone:f.get("phone"),email:f.get("email"),address:f.get("address"),method:f.get("method"),items:cart})});let data=await r.json();if(!r.ok){alert(data.detail||"Could not place order");return}localStorage.removeItem("varaahaCart");document.getElementById("formWrap").style.display="none";document.getElementById("success").style.display="block";document.getElementById("msg").textContent=`Thank you, ${f.get("name")}. Your order number is ${data.order_id}. Varaaha Silks will confirm availability and delivery details.`};
</script><div style="margin:25px auto;max-width:700px;padding:18px;border:1px solid #e2d1bd;border-radius:12px;background:#fffaf4"><b>Already placed an order?</b><br><a href="/track.html">Track your Varaaha Silks order →</a></div></body></html>
