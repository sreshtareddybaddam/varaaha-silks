<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bag | Varaaha Silks</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;background:#f8f4ed;color:#30251f;font-family:"DM Sans"}header{padding:24px 7vw;border-bottom:1px solid #e3d8ce;display:flex;justify-content:space-between}header a{color:inherit;text-decoration:none;font-size:12px}.logo{font:600 20px "Playfair Display";letter-spacing:3px}.logo small{display:block;font:8px "DM Sans";letter-spacing:4px;text-align:center}main{max-width:1100px;margin:auto;padding:60px 7vw}h1{font:600 54px "Playfair Display"}.layout{display:grid;grid-template-columns:1fr 330px;gap:40px}.item{display:grid;grid-template-columns:100px 1fr auto;gap:18px;padding:18px 0;border-top:1px solid #ddd1c6}.item img{width:100px;height:130px;object-fit:cover}.item h2{font:20px "Playfair Display";margin:0}.meta{font-size:10px;color:#8b7b72}.qty{margin-top:12px}.qty button{border:1px solid #d5c8bc;background:none;width:26px;height:26px}.summary{background:#eee5dc;padding:25px}.line{display:flex;justify-content:space-between;padding:11px 0;font-size:12px}.total{border-top:1px solid #d0c0b4;margin-top:10px;padding-top:18px;font-weight:600}.btn{display:block;text-align:center;padding:15px;margin-top:18px;text-decoration:none;font-size:11px;background:#30251f;color:white}.remove{border:0;background:none;color:#8b5d48;font-size:10px;margin-top:10px}@media(max-width:800px){main{padding:40px 20px}.layout{grid-template-columns:1fr}.item{grid-template-columns:80px 1fr}.item img{width:80px;height:110px}}
</style></head><body><header><a class="logo" href="/">VARAAHA<small>SILKS</small></a><a href="/">← Shop</a></header><main><h1>Your Bag</h1><div class="layout"><section id="items"></section><aside class="summary"><h2>Order summary</h2><div class="line"><span>Subtotal</span><b id="total">₹0</b></div><a class="btn" href="checkout.html">PROCEED TO CHECKOUT</a></aside></div></main>
<script>
let cart=JSON.parse(localStorage.getItem("varaahaCart")||"[]");const money=n=>"₹"+Number(n).toLocaleString("en-IN");
function render(){let box=document.getElementById("items");if(!cart.length){box.innerHTML="<p>Your bag is empty.</p>";return}box.innerHTML=cart.map((p,i)=>`<article class="item"><img src="/static/${p.image}" alt=""><div><h2>${p.name}</h2><div class="meta">${p.category}</div><div class="qty"><button onclick="change(${i},-1)">−</button> ${p.qty} <button onclick="change(${i},1)">+</button></div><button class="remove" onclick="removeIt(${i})">REMOVE</button></div><b>${money(p.price*p.qty)}</b></article>`).join("");document.getElementById("total").textContent=money(cart.reduce((s,p)=>s+p.price*p.qty,0))}
function save(){localStorage.setItem("varaahaCart",JSON.stringify(cart));render()}function change(i,d){cart[i].qty+=d;if(cart[i].qty<1)cart.splice(i,1);save()}function removeIt(i){cart.splice(i,1);save()}render();
</script></body></html>
