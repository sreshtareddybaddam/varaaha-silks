<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Varaaha Silks — Admin</title>
<style>
body{font-family:Arial,sans-serif;background:#f8f1e8;color:#3e2222;margin:0}
header{background:#4b1824;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}
main{max-width:1200px;margin:28px auto;padding:0 18px}
.card{background:#fffaf4;border:1px solid #e4d2bc;border-radius:14px;padding:20px;margin-bottom:20px;box-shadow:0 6px 20px #0000000a}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
input,select,textarea,button{width:100%;box-sizing:border-box;padding:11px;border-radius:9px;border:1px solid #d6c1aa}
button{background:#4b1824;color:#fff;border:0;cursor:pointer}
button.alt{background:#9b7b3f} button.danger{background:#8d2832}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px;border-bottom:1px solid #eadccc;text-align:left;vertical-align:top}
img.thumb{width:65px;height:80px;object-fit:cover;border-radius:8px}
.hidden{display:none}.muted{color:#7a6559}.stats{font-size:25px;font-weight:700}.row{display:flex;gap:8px;align-items:center}
@media(max-width:700px){table{font-size:12px}th:nth-child(5),td:nth-child(5){display:none}}
</style>
</head>
<body>
<header><strong>VARAAHA SILKS — ADMIN</strong><span id="status">Not signed in</span></header>
<main>
<section id="loginCard" class="card">
<h2>Admin Login</h2>
<div class="grid"><input id="user" placeholder="Username" value="admin"><input id="pass" type="password" placeholder="Password"></div>
<br><button onclick="login()">Sign in</button><p id="loginMsg" class="muted"></p>
</section>

<div id="app" class="hidden">
<section class="grid">
<div class="card"><div class="muted">Orders</div><div id="ordersCount" class="stats">0</div></div>
<div class="card"><div class="muted">Revenue</div><div id="revenue" class="stats">₹0</div></div>
<div class="card"><div class="muted">Low stock</div><div id="lowStock" class="stats">0</div></div>
</section>

<section class="card">
<h2 id="formTitle">Add Product</h2>
<div class="grid">
<input id="pid" placeholder="Product ID (optional, e.g. VS004)">
<input id="pname" placeholder="Product name">
<input id="pcat" placeholder="Category">
<input id="pprice" type="number" placeholder="Price">
<input id="pcolor" placeholder="Colour">
<input id="pocc" placeholder="Occasion">
<input id="pstock" type="number" placeholder="Stock">
<input id="pimage" placeholder="Image path, e.g. images/saree4.jpg"><input id="pfile" type="file" accept="image/*" onchange="uploadImage()">
</div>
<br><textarea id="pdesc" placeholder="Description"></textarea><br><br>
<div class="row"><button onclick="saveProduct()">Save product</button><button class="alt" onclick="clearForm()">Clear</button></div>
<p id="productMsg" class="muted"></p>
</section>

<section class="card">
<h2>Products</h2><div style="overflow:auto"><table><thead><tr><th>Image</th><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead><tbody id="products"></tbody></table></div>
</section>

<section class="card">
<h2>Orders</h2><div style="overflow:auto"><table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr></thead><tbody id="orders"></tbody></table></div>
</section>
</div>
</main>
<script>
let token="", editing=null;
const $=id=>document.getElementById(id);
async function login(){
 const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('user').value,password:$('pass').value})});
 const d=await r.json();
 if(!r.ok){$('loginMsg').textContent=d.detail||'Login failed';return}
 token=d.token; $('loginCard').classList.add('hidden'); $('app').classList.remove('hidden'); $('status').textContent='Signed in'; load();
}
function headers(){return {'Authorization':'Bearer '+token,'Content-Type':'application/json'}}
async function load(){
 const [p,o,s]=await Promise.all([
 fetch('/api/admin/products',{headers:headers()}),fetch('/api/admin/orders',{headers:headers()}),fetch('/api/admin/stats',{headers:headers()})
 ]);
 const products=await p.json(), orders=await o.json(), stats=await s.json();
 $('ordersCount').textContent=stats.orders??orders.length;
 $('revenue').textContent='₹'+Number(stats.revenue||0).toLocaleString('en-IN');
 $('lowStock').textContent=products.filter(x=>Number(x.stock)<=2).length;
 $('products').innerHTML=products.map(x=>`<tr>
<td>${x.image?`<img class="thumb" src="/static/${x.image.replace(/^\/?/,'')}">`:''}</td>
<td><b>${esc(x.name)}</b><br><span class="muted">${esc(x.id)}</span></td>
<td>${esc(x.category)}</td><td>₹${Number(x.price).toLocaleString('en-IN')}</td><td>${x.stock}</td>
<td><button onclick='editProduct(${JSON.stringify(x)})'>Edit</button><br><br><button class="danger" onclick="delProduct('${x.id}')">Delete</button></td></tr>`).join('');
 $('orders').innerHTML=orders.map(o=>`<tr><td><b>${o.id}</b><br><span class="muted">${o.created_at||''}</span></td>
<td>${esc(o.customer_name)}<br>${esc(o.phone)}</td><td>${esc(o.items_summary||'')}</td><td>₹${Number(o.total).toLocaleString('en-IN')}</td>
<td><select onchange="status('${o.id}',this.value)">${['Pending','Confirmed','Packed','Shipped','Delivered','Cancelled'].map(x=>`<option ${o.status===x?'selected':''}>${x}</option>`).join('')}</select></td></tr>`).join('');
}
function editProduct(x){
 editing=x.id;$('formTitle').textContent='Edit Product — '+x.id;
 ['pid','pname','pcat','pprice','pcolor','pocc','pstock','pimage','pdesc'].forEach((id,i)=>$(id).value=[x.id,x.name,x.category,x.price,x.color,x.occasion,x.stock,x.image,x.description][i]||'');
 window.scrollTo({top:0,behavior:'smooth'});
}
function clearForm(){editing=null;$('formTitle').textContent='Add Product';['pid','pname','pcat','pprice','pcolor','pocc','pstock','pimage','pdesc'].forEach(id=>$(id).value='')}
async function uploadImage(){
 const f=$('pfile').files[0]; if(!f)return;
 const fd=new FormData(); fd.append('file',f);
 const r=await fetch('/api/admin/upload-image',{method:'POST',headers:{'Authorization':'Bearer '+token},body:fd});
 const d=await r.json(); if(r.ok){$('pimage').value=d.image;$('productMsg').textContent='Image uploaded';} else $('productMsg').textContent=d.detail||'Upload failed';
}
async function saveProduct(){
 const body={id:$('pid').value||null,name:$('pname').value,category:$('pcat').value,price:Number($('pprice').value),color:$('pcolor').value,occasion:$('pocc').value,stock:Number($('pstock').value),image:$('pimage').value,description:$('pdesc').value};
 const url=editing?'/api/admin/products/'+editing:'/api/admin/products';
 const r=await fetch(url,{method:editing?'PUT':'POST',headers:headers(),body:JSON.stringify(body)});
 const d=await r.json(); $('productMsg').textContent=r.ok?'Saved successfully':(d.detail||'Could not save');
 if(r.ok){clearForm();load()}
}
async function delProduct(id){if(!confirm('Delete '+id+'?'))return;const r=await fetch('/api/admin/products/'+id,{method:'DELETE',headers:headers()});if(!r.ok)alert('Delete failed');load()}
async function status(id,v){await fetch('/api/admin/orders/'+id,{method:'PATCH',headers:headers(),body:JSON.stringify({status:v})});load()}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
</script>
</body></html>
