<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — Varaaha Silks</title><style>body{margin:0;background:#f8f1e8;color:#43232a;font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:50px auto;padding:20px}.product{display:grid;grid-template-columns:1fr 1fr;gap:35px;background:#fffaf4;border-radius:18px;padding:25px}.product img{width:100%;max-height:650px;object-fit:cover;border-radius:14px}button{background:#4b1824;color:#fff;border:0;padding:13px 18px;border-radius:9px;cursor:pointer}@media(max-width:700px){.product{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a href="/">← Varaaha Silks</a><div id="p" class="product" style="margin-top:20px"></div></div><script>const id=new URLSearchParams(location.search).get('id');fetch('/api/products').then(r=>r.json()).then(ps=>{const x=ps.find(p=>p.id===id)||ps[0];if(!x)return;p.innerHTML=`<img src="/static/${x.image}"><div><p>${x.category}</p><h1>${x.name}</h1><h2>₹${Number(x.price).toLocaleString('en-IN')}</h2><p>${x.description||'A beautiful Varaaha Silks saree selected for festive and special occasions.'}</p><p>Colour: ${x.color||'—'}</p><p>Occasion: ${x.occasion||'—'}</p><p>Stock: ${x.stock}</p><button onclick="add()">ADD TO BAG</button></div>`;window.prod=x});function add(){let c=JSON.parse(localStorage.getItem('cart')||'[]');let i=c.find(x=>x.id===prod.id);if(i)i.qty++;else c.push({id:prod.id,qty:1});localStorage.setItem('cart',JSON.stringify(c));location.href='/cart.html'}</script></body></html>
