<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop — Varaaha Silks</title><style>body{margin:0;background:#f8f1e8;color:#43232a;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:40px auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.card{background:#fffaf4;border-radius:14px;padding:14px}.card img{width:100%;height:320px;object-fit:cover;border-radius:10px}button{background:#4b1824;color:#fff;border:0;padding:10px 14px;border-radius:8px;cursor:pointer}</style></head><body><div class="wrap"><a href="/">← Home</a><h1>Shop Varaaha Silks</h1><div id="grid" class="grid"></div></div><script>fetch('/api/products').then(r=>r.json()).then(ps=>grid.innerHTML=ps.map(p=>`<div class="card"><img src="/static/${p.image}"><h3>${p.name}</h3><p>${p.category}</p><b>₹${Number(p.price).toLocaleString('en-IN')}</b><p><button onclick="location.href='/product.html?id=${p.id}'">View</button></p></div>`).join(''))</script></body></html>
